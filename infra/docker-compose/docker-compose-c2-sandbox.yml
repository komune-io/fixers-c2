services:
  ca.bc-coop.bclan:
    container_name: ca-bclan-${DOCKER_NETWORK}
    image: ${DOCKER_REPOSITORY}c2-sandbox-ca:${VERSION_C2}
    ports:
      - "7054:7054"
    networks:
      - net

  orderer.bclan:
    container_name: orderer-${DOCKER_NETWORK}
    image: ${DOCKER_REPOSITORY}c2-sandbox-orderer:${VERSION_C2}
    ports:
      - "7050:7050"
    networks:
      - net

  couchdb.bc-coop.bclan:
    container_name: couchdb-bclan-network-it
    image: couchdb:3.4.3
    environment:
      - COUCHDB_USER=${BCLAN_COUCH_USER}
      - COUCHDB_PASSWORD=${BCLAN_COUCH_PASS}
    # CouchDB answers before it has applied the admin from COUCHDB_USER: an early request gets a 401, and the
    # peer panics on it at startup and stays down. Healthy means an authenticated request succeeds.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$$COUCHDB_USER:$$COUCHDB_PASSWORD\" http://localhost:5984/_up"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "5984:5984"
    networks:
      - net
    depends_on:
      - orderer.bclan

  peer0.bc-coop.bclan:
    container_name: peer0-bclan-${DOCKER_NETWORK}
    image: ${DOCKER_REPOSITORY}c2-sandbox-peer:${VERSION_C2}
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=${DOCKER_NETWORK}
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=${BCLAN_COUCH_ADDRESS}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${BCLAN_COUCH_USER}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${BCLAN_COUCH_PASS}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
    ports:
      - "7051:7051"
      - "7053:7053"
    networks:
      - net
    depends_on:
      orderer.bclan:
        condition: service_started
      couchdb.bc-coop.bclan:
        condition: service_healthy

networks:
  net:
    name: ${DOCKER_NETWORK}
    external: true
